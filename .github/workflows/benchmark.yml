permissions:
  pull-requests: write
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install deps
      run: go mod download

    - name: Run benchmarks and format results
      run: |
        echo "| Benchmark | Ops/sec |" > benchmark.md
        echo "|-----------|---------|" >> benchmark.md

        make benchmark read > full_benchmark.log
        make benchmark write >> full_benchmark.log

        awk '
          /BenchmarkMemtable_/ { benchmark=$1 }
          /Ops\/sec:/ {
            match($0, /Ops\/sec: ([0-9.]+[MK]?)/, m)
            if (m[1] != "") {
              printf "| %s | %s |\n", benchmark, m[1]
            }
          }
        ' full_benchmark.log >> benchmark.md

        cat benchmark.md

    - name: Comment benchmark results on PR
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        path: benchmark.md
